<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="MedNexus – Hospital Asset Management System. Secure login portal for staff and administrators." />
  <title>MedNexus – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/glass.css" />
</head>

<body class="login-page">

  <main class="login-card" role="main" aria-label="MedNexus Login">

    <!-- Brand -->
    <div class="login-brand">
      <h1 class="login-title">MedNexus</h1>
      <p class="login-subtitle">Hospital Asset Management</p>
    </div>

    <!-- Error Banner (hidden by default) -->
    <div id="login-error" class="login-error hidden" role="alert" aria-live="assertive">
      <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        </svg>️</span>
      <span id="login-error-text">Invalid User ID or Password.</span>
    </div>

    <!-- Form -->
    <form id="login-form" novalidate>

      <div class="form-group">
        <label class="form-label" for="user-id">User ID</label>
        <input type="text" id="user-id" name="userId" class="form-control" autocomplete="username" spellcheck="false"
          placeholder="Enter User ID" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" name="password" class="form-control" autocomplete="current-password"
            style="padding-right:70px;" placeholder="Enter password" required />
          <button type="button" id="toggle-pw"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:.78rem;font-weight:700;color:var(--border-subtle);letter-spacing:.03em;padding:4px 6px;border-radius:4px;transition:color .18s;"
            aria-label="Toggle password visibility">Show</button>
        </div>
      </div>

      <button type="submit" class="login-submit-btn" id="login-btn" disabled>
        <span class="btn-text">Sign In</span>
        <div id="login-spinner" class="spinner hidden" aria-hidden="true"></div>
      </button>

    </form>

  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      'use strict';

      const form = document.getElementById('login-form');
      const userIdEl = document.getElementById('user-id');
      const passwordEl = document.getElementById('password');
      const errorBox = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      const loginBtn = document.getElementById('login-btn');
      const spinner = document.getElementById('login-spinner');

      
      loginBtn.disabled = false;

      
      function showError(msg) {
        errorText.textContent = msg;
        errorBox.classList.remove('hidden');
        userIdEl.classList.add('is-error');
        passwordEl.classList.add('is-error');
        loginBtn.disabled = false;
        spinner.classList.add('hidden');
      }

      function clearError() {
        errorBox.classList.add('hidden');
        userIdEl.classList.remove('is-error');
        passwordEl.classList.remove('is-error');
      }

      
      document.getElementById('toggle-pw').addEventListener('click', function () {
        const isHidden = passwordEl.type === 'password';
        passwordEl.type = isHidden ? 'text' : 'password';
        this.textContent = isHidden ? 'Hide' : 'Show';
        this.style.color = isHidden ? 'var(--action-btn)' : 'var(--text-muted)';
      });

      [userIdEl, passwordEl].forEach(el => el.addEventListener('input', clearError));

      
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();

        const id = userIdEl.value.trim();
        const pw = passwordEl.value;

        if (!id || !pw) {
          showError('User ID and Password are required.');
          return;
        }

        loginBtn.disabled = true;
        spinner.classList.remove('hidden');

        const result = await Auth.login(id, pw);

        if (!result.success) {
          showError(result.message || 'Invalid credentials.');
          return;
        }

        /* Route by ID prefix */
        if (id.toUpperCase().startsWith('ADM-')) {
          localStorage.setItem('adminActiveTab', 'dashboard');
          window.location.href = 'admin-dashboard.html';
        } else {
          localStorage.setItem('staffActiveTab', 'dashboard');
          window.location.href = 'staff-dashboard.html';
        }
      });

    })();
  </script>

</body>

</html>
