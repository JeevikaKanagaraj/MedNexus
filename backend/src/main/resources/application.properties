# Database Configuration
# Supports local H2 in-memory zero-config fallback and production MySQL auto-connect via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${MYSQLHOST:jdbc:h2:mem:mednexusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}}}
spring.datasource.username=${MYSQLUSER:sa}
spring.datasource.password=${MYSQLPASSWORD:}

# H2 Console Configuration (Dev & Debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL Initialization / Seeding
spring.sql.init.mode=never

# Server
server.port=${PORT:8080}

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# Jackson Serialization / Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.property-naming-strategy=SNAKE_CASE